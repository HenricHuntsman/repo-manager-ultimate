name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Electron entry scripts
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
      - name: Build dashboard
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Test dependency-free RepoForge Doctor
        run: python3 -m unittest discover -s tests -p 'test_repo_doctor.py' -v
      - name: Validate Colab notebook structure and Python cell syntax
        run: |
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path
          file = Path("colab/RepoForge_Greenlight_Workbench.ipynb")
          nb = json.loads(file.read_text(encoding="utf-8"))
          assert nb["nbformat"] == 4
          assert len(nb["cells"]) >= 6
          for i, cell in enumerate(nb["cells"]):
              if cell["cell_type"] == "code":
                  assert not cell.get("outputs"), f"Saved execution output in cell {i}"
                  assert cell.get("execution_count") is None
                  ast.parse("".join(cell["source"]), filename=f"{file}:cell-{i}")
          print(f"Validated {len(nb['cells'])} notebook cells; no saved runtime outputs.")
          PY
      - name: Build public hosted Vercel variant
        env:
          VITE_PUBLIC_HOSTED: 'true'
        run: |
          npm run build
          test -s dist/index.html
