name: Linux package qualification
on:
  push:
    paths: [.github/workflows/linux-package-qualification.yml, package.json, package-lock.json, electron/**, scripts/desktop-smoke.cjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libarchive-tools rpm libgtk-3-0 libnss3 libasound2t64 libgbm1 libxtst6 libxss1 libsecret-1-dev libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: npm ci
      - run: npm test
      - name: Build Linux packages without publishing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:linux
      - name: Resolve the Electron runtime
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const binary = require("electron");
          fs.appendFileSync(process.env.GITHUB_ENV, `REPOFORGE_ELECTRON_BINARY=${binary}\nREPOFORGE_SANDBOX_HELPER=${path.join(path.dirname(binary), "chrome-sandbox")}\n`);
          JS
      - name: Configure Electron sandbox helper on disposable runner
        run: |
          test -f "$REPOFORGE_SANDBOX_HELPER"
          sudo chown root:root "$REPOFORGE_SANDBOX_HELPER"
          sudo chmod 4755 "$REPOFORGE_SANDBOX_HELPER"
      - name: Verify offline Electron window
        run: xvfb-run -a -s "-screen 0 1920x1080x24" "$REPOFORGE_ELECTRON_BINARY" scripts/desktop-smoke.cjs
      - name: Retain desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-startup-evidence
          path: desktop-evidence/
      - name: Retain packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

